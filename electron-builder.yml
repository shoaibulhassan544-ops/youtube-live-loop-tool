appId: com.shoaibazeez.youtubeliveloop
productName: YouTube Live Loop Tool
directories:
  output: dist
files:
  - package.json
  - src/**
  - assets/**
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: YouTube Live Loop Tool
