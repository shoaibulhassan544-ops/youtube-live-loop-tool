name: Build Windows installer

# Builds the YouTube Live Loop Tool installer (.exe) on Windows.
# Trigger: push a version tag (v1.0.0, v1.1.0, ...) or manual Run workflow.
#
# Repo lives on shoaibulhassan544-ops (Actions works there). It was moved
# off the ShoaibAzeez account because GitHub Actions is DISABLED there
# (support ticket #4937420, still open, no reply yet).
# Until then, build locally on Windows with build-windows.bat.
#
# FIX (2026-11-04): windows-latest runners do NOT ship ffmpeg/ffprobe, so
# the self-test's 4 ffmpeg checks failed (41 PASS, 4 FAIL, run 41800727216).
# Install FFmpeg via Chocolatey before running the tests.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg (needed by the self-test)
        run: choco install ffmpeg -y --no-progress
      - name: Self-test (syntax + FFmpeg command checks, no stream key needed)
        run: npm test
      - name: Build installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeLiveLoopTool-Setup
          path: dist/*.exe
